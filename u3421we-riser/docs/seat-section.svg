<style>.top{fill:#d3d8de;stroke:#1f2933;stroke-width:2}.blk{fill:#4a4f55;stroke:#1f2933;stroke-width:2}.part{fill:#8fbce6;stroke:#1d4f7c;stroke-width:2}
