<text x="645.0" y="297.5" class="n" text-anchor="middle">TOP VIEW · REAR (wall) is up · FRONT (you) is down · curvature exaggerated so the direction is obvious · dashed orange = a straightedge laid corner to corner</text>
<g transform="translate(60,331.5)">
<text class="nb" x="0" y="0">What I need measured (mm):</text>
<text class="n" x="0" y="24"><tspan font-weight="700">A</tspan> widest width across the rear   ·   <tspan font-weight="700">B</tspan> widest width across the front   ·   <tspan font-weight="700">C</tspan> depth front-to-back along the centre line</text>
<text class="n" x="0" y="48"><tspan font-weight="700">Sr</tspan> rear bow: gap between a straightedge and the rear edge — at the centre if it bows in, at the ends (where the corner rounding starts) if it bows out</text>
<text class="n" x="0" y="72"><tspan font-weight="700">Sf</tspan> front bow: same measurement on the front edge   ·   <tspan font-weight="700">R</tspan> corner radius (front and rear, if different)   ·   <tspan font-weight="700">T</tspan> plate thickness at the edge</text>
</g>
</svg>