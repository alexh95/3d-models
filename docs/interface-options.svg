<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="450" viewBox="0 0 1290 450" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<style>.plate{fill:#dfe3e8;stroke:#1f2933;stroke-width:2}.part{fill:#8fbce6;stroke:#1d4f7c;stroke-width:2}.foot{fill:#33393f}
.t{font-size:18px;font-weight:700;text-anchor:middle;fill:#111}.s{font-size:13px;text-anchor:middle;fill:#444}
.lab{font-size:13px;text-anchor:middle;fill:#3d4854}.d{stroke:#555;stroke-width:1.2}.ld{stroke:#555;stroke-width:1}
.dl{font-size:13px;fill:#222}.n{font-size:13px;text-anchor:middle;fill:#333}.nb{font-size:14px;font-weight:700;fill:#111}
.fp{stroke:#c2410c;stroke-width:1.3;stroke-dasharray:6 4}.fpt{font-size:12px;fill:#c2410c}.sep{stroke:#d0d5db}</style>
<rect width="1290" height="450" fill="#fff"/>
<text x="30" y="28" class="nb">CROSS-SECTION at the plate edge · outside of the riser is on the left · grey = Dell plate, black = rubber foot, blue = printed top module</text>
<text x="220" y="60" class="t">Seat L · perimeter lip</text><text x="220" y="80" class="s">plate drops into a shallow tray</text><path d="M140,150 H410 l-8,15 l8,15 l-8,15 l8,15 H140 Z" class="plate"/><text x="275" y="185" class="lab">monitor base plate</text><rect x="190" y="210" width="60" height="9" class="foot"/><text x="258" y="232" class="sm" fill="#fff"></text><path d="M125,195 H137 V219 H410 l-4,6 l4,6 H154 V330 l-7,-4 l-7,4 V234 L125,219 Z" class="part"/><line x1="365" y1="150" x2="365" y2="210" class="d" marker-start="url(#a)" marker-end="url(#a)"/><text x="373" y="184.0" class="dl" text-anchor="start">T = ?</text><line x1="220" y1="210" x2="220" y2="219" class="d" marker-start="url(#a)" marker-end="url(#a)"/><text x="228" y="218.5" class="dl" text-anchor="start"></text><text x="170" y="266" class="dl">F = ? (rubber foot height)</text><line x1="220" y1="222" x2="220" y2="249" class="ld"/><line x1="131" y1="192" x2="100" y2="125" class="ld"/><text x="40" y="106" class="dl">lip sits ≈2.5 mm</text><text x="40" y="122" class="dl">outside the outline</text><line x1="140" y1="335" x2="140" y2="375" class="fp"/><text x="146" y="372" class="fpt">plate outline = body outline</text><text x="220" y="405" class="n">+ self-centring, works without knowing foot positions</text><text x="220" y="423" class="n">− top module is slightly larger than the plate</text><line x1="440" y1="45" x2="440" y2="430" class="sep"/><text x="650" y="60" class="t">Seat P · foot pockets</text><text x="650" y="80" class="s">rubber feet drop into matching recesses</text><path d="M570,150 H840 l-8,15 l8,15 l-8,15 l8,15 H570 Z" class="plate"/><text x="705" y="185" class="lab">monitor base plate</text><rect x="620" y="210" width="60" height="9" class="foot"/><text x="688" y="232" class="sm" fill="#fff"></text><path d="M570,213 H616 V219 H684 V213 H840 l-4,9 l4,9 H584 V330 l-7,-4 l-7,4 Z" class="part"/><line x1="795" y1="150" x2="795" y2="210" class="d" marker-start="url(#a)" marker-end="url(#a)"/><text x="803" y="184.0" class="dl" text-anchor="start">T = ?</text><text x="600" y="266" class="dl">pocket ≈1 mm deep under each foot</text><line x1="650" y1="222" x2="650" y2="249" class="ld"/><line x1="570" y1="335" x2="570" y2="375" class="fp"/><text x="576" y="372" class="fpt">plate outline = body outline</text><text x="650" y="405" class="n">+ nothing sticks out past the plate, invisible</text><text x="650" y="423" class="n">− needs exact position and size of every foot</text><line x1="870" y1="45" x2="870" y2="430" class="sep"/><text x="1070" y="60" class="t">Plate edge, seen from the side</text><text x="1070" y="80" class="s">which one is yours?</text><path d="M920,110 H1060 l-6,12 l6,12 l-6,12 l6,12 H920 Z" class="plate"/><text x="1080" y="132" class="nb">E1 · square</text><text x="1080" y="150" class="dl">vertical edge</text><path d="M920,190 H1060 l-6,12 l6,12 l-6,12 l6,12 H950 Z" class="plate"/><text x="1080" y="212" class="nb">E2 · undercut</text><text x="1080" y="230" class="dl">bottom smaller than top</text><path d="M944,270 H1060 l-6,12 l6,12 l-6,12 l6,12 H944 a24,24 0 0 1 0,-48 Z" class="plate"/><text x="1080" y="292" class="nb">E3 · rounded</text><text x="1080" y="310" class="dl">bullnose edge</text><path d="M950,350 H1060 l-6,12 l6,12 l-6,12 l6,12 H920 Z" class="plate"/><text x="1080" y="372" class="nb">E4 · bevelled top</text><text x="1080" y="390" class="dl">top smaller than bottom</text>
</svg>